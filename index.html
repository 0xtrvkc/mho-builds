<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outlanders Armor Planner</title>
<meta name="theme-color" content="#0c0d10">
<meta name="description" content="Armor build planner for Monster Hunter Outlanders. Pick up to 3 priority skills and compare trade-off builds.">
<style>
:root{color-scheme:dark;--bg:#0c0d10;--s1:#14161b;--s2:#1b1e25;--s3:#262a33;--line:#252932;--line2:#343a47;--tx:#eceef2;--mute:#9aa1b0;--acc:#9db4ff;--ok:#8fd3a8;--warn:#e8b254;--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
.p0{--pc:#8fb0ff;--pb:#8fb0ff26}.p1{--pc:#7fd6a0;--pb:#7fd6a026}.p2{--pc:#f0b866;--pb:#f0b86626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,dl,dd{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;touch-action:manipulation}
button:disabled{cursor:default}
a{color:var(--acc);text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) var(--gr) 10px var(--gl)}
.brand{min-width:0}
.brand h1{font-size:16px;font-weight:650;line-height:1.2;white-space:nowrap}
.brand p{font-size:12px;color:var(--mute);line-height:1.2;margin-top:2px;white-space:nowrap}
.appbar-actions{display:flex;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line2);font-size:13px;white-space:nowrap}
.pill:active{background:var(--s3)}
.pill:disabled{opacity:.4}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.old .dot{background:var(--warn)}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:16px var(--gr) calc(40px + env(safe-area-inset-bottom,0px)) var(--gl)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px}
.card+.card{margin-top:16px}
.card-h,.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.card-h h2,.sec-h h2{font-size:12px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.hint{font-size:12px;color:var(--mute)}
.res{margin-top:20px}
.detail>.card{margin-top:0}
.detail{display:grid;gap:16px}
.link{color:var(--acc);font-size:13px;min-height:44px;display:inline-flex;align-items:center}

/* priorities */
.prow{display:block;width:100%;border:1px solid var(--line2);border-left:4px solid var(--pc);border-radius:12px;background:var(--s2);padding:6px 6px 8px 12px;margin-bottom:8px}
.prow:last-child{margin-bottom:0}
.prow.empty{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 12px;border-style:dashed;background:transparent;color:var(--mute)}
.prow.empty:active{background:var(--s2)}
.ptag{flex:none;font-size:12px;font-weight:700;color:var(--pc);letter-spacing:.04em;min-width:22px}
.pempty{flex:1;font-size:15px}
.pplus{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--pc)}
.prow-top{display:flex;align-items:center}
.pmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px}
.pname{font-size:17px;font-weight:600;line-height:1.25}
.ibtn,.xbtn{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--mute);border-radius:50%}
.ibtn span{width:22px;height:22px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;font:italic 700 13px/1 Georgia,serif}
.ibtn[aria-expanded=true]{color:var(--pc)}
.xbtn{font-size:26px;line-height:1}
.prow-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:6px}
.pstat{font-size:13px;color:var(--mute);min-width:0}
.pstat .warn{display:block;color:var(--warn)}
.step{flex:none;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:999px}
.step button{width:44px;height:44px;display:grid;place-items:center;font-size:22px;line-height:1;border-radius:50%;text-align:center}
.step button:active:not(:disabled){background:var(--s3)}
.step button:disabled{opacity:.3}
.sval{min-width:44px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.sval small{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--mute)}
.pinfo{margin:8px 6px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.pinfo a{display:inline-block;margin-top:4px}

/* empty state */
.start{text-align:center;padding:28px 18px}
.start h2{font-size:18px;font-weight:650;margin-bottom:6px;letter-spacing:0;text-transform:none;color:var(--tx)}
.start p{color:var(--mute);margin:0 auto 16px;max-width:36ch}

/* options strip */
.opts{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--gr)*-1) 16px calc(var(--gl)*-1);padding:2px var(--gr) 6px var(--gl);scroll-padding-left:var(--gl);scrollbar-width:none;overscroll-behavior-x:contain}
.opts::-webkit-scrollbar{display:none}
.opt{flex:0 0 min(78%,300px);scroll-snap-align:start;display:block;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 12px 6px}
.opt.sel{border-color:var(--acc);background:#161a26;box-shadow:inset 0 0 0 1px var(--acc)}
.oh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.ol{font-size:13px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.om{font-size:12px;color:var(--mute);text-align:right}
.sb{display:block;margin-bottom:8px}
.sbt{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.sbt span:first-child{color:var(--pc);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbt span:last-child{font-variant-numeric:tabular-nums}
.bar{display:block;height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--pc);transform-origin:left;border-radius:3px}

/* selected build */
.rows{border-top:1px solid var(--line)}
.r2{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 2px;border-bottom:1px solid var(--line)}
.r2:last-child{border-bottom:0}
.r2:active{background:var(--s2)}
.slotl{flex:none;width:48px;font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pbody{flex:1;min-width:0}
.piname{display:block;font-size:16px;font-weight:600;line-height:1.3}
.r2.free .piname{color:var(--mute);font-weight:500}
.sub{display:block;font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.c{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;background:var(--s3);color:var(--mute);white-space:nowrap}
.c.cp{background:var(--pb);color:var(--pc)}
.pright{display:flex;align-items:center;flex:none}
.chev{color:var(--mute);font-size:22px;line-height:1}
.badge{font-size:11px;font-weight:600;color:var(--acc);border:1px solid #2f3b63;border-radius:999px;padding:0 8px;line-height:20px;margin-right:6px}

/* totals */
.trow{display:block;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.tt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.trow.cp .tt span:first-child{color:var(--pc);font-weight:600}
.tv{font-variant-numeric:tabular-nums;white-space:nowrap}
.over{font-size:12px;color:var(--warn);margin-left:6px}
.trow .bar{margin-top:6px}
.sub-h{font-size:12px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 0 4px}
.setb{padding:9px 0;border-bottom:1px solid var(--line)}
.setb:last-of-type{border-bottom:0}
.setb.on .tv{color:var(--ok)}
.mu{font-size:12px;color:var(--mute);margin-top:2px}
.note{font-size:12px;color:var(--mute);margin-top:10px}

/* sheet */
dialog{border:0;padding:0;background:transparent;color:inherit;max-width:none;max-height:none;width:100%;margin:auto 0 0;overflow:visible}
dialog::backdrop{background:rgba(0,0,0,.62)}
.sheet{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;max-height:86vh;max-height:86dvh;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-h h2{font-size:17px;font-weight:650;line-height:1.25}
#sheetX{flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:28px;line-height:1;color:var(--mute);border-radius:50%;text-align:center}
.sheet-b{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.searchwrap{position:sticky;top:0;z-index:1;background:var(--s1);padding:10px 16px;border-bottom:1px solid var(--line)}
.search{display:block;width:100%;height:46px;padding:0 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--tx);font:16px/1 inherit;appearance:none;-webkit-appearance:none}
.search::placeholder{color:#6f7684}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:9px 16px;border-bottom:1px solid var(--line)}
.srow:active{background:var(--s2)}
.srow.cur{background:#161a26}
.sr-main{flex:1;min-width:0}
.sr-name{display:block;font-size:16px;font-weight:600}
.sr-desc{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-lv{flex:none;font-size:12px;color:var(--mute);text-align:right}
.none{padding:24px 16px;color:var(--mute);text-align:center}
.sr-div{padding:14px 16px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.sr-div b{display:block;font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sr-div span{font-size:12px;color:var(--mute)}
.pl{display:block;width:100%;padding:10px 16px;border-bottom:1px solid var(--line)}
.pl:active{background:var(--s2)}
.pl.cur{background:#161a26}
.pl.dim .pn,.pl.dim .sub{opacity:.55}
.pl .r1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pn{font-weight:600;font-size:16px}
.pd{font-size:12px;color:var(--mute);white-space:nowrap}
.unpin{display:block;width:100%;padding:14px 16px;color:var(--acc);border-bottom:1px solid var(--line);min-height:48px}
.pi{padding:12px 16px 0}
.pi-meta{font-size:13px;color:var(--mute);margin-bottom:6px}
.tl{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--line)}
.tl.cp span:first-child{color:var(--pc);font-weight:600}
.tl span:last-child{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.pi .setb{border-bottom:0;padding-top:12px}
.pi .setb p{font-size:13px;color:var(--mute);margin-top:2px}
.acts{display:grid;gap:8px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:0 16px;border-radius:12px;background:var(--acc);color:#0c0d10;font-weight:650;text-align:center}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line2)}
.btn:active{filter:brightness(.9)}
.info{padding:14px 16px 8px;display:grid;gap:14px}
.info dl{display:grid;gap:0;border-top:1px solid var(--line)}
.info dl>div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.info dt{color:var(--mute)}
.info p{color:var(--mute);font-size:13px}
.warnbox{color:var(--warn)!important;border:1px solid #5a4620;background:#2a2212;border-radius:10px;padding:10px 12px}

/* hover tooltip (mouse only) */
#tip{position:fixed;left:0;top:0;z-index:60;width:290px;background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:4px 14px 12px;font-size:13px;pointer-events:none;box-shadow:0 10px 30px #000a}
#tip h4{font-size:14px;margin:10px 0 2px}
#tip .pi{padding:0}

@media(max-width:359px){.brand p{display:none}}
@media(min-width:700px){
 dialog{margin:auto;width:min(520px,calc(100% - 32px))}
 .sheet{border-radius:18px;border-bottom:1px solid var(--line2);max-height:80vh;max-height:80dvh}
 .grab{display:none}
}
@media(min-width:920px){
 .wrap{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;align-items:start;padding-top:24px}
 .side{position:sticky;top:84px}
 .res{margin-top:0}
 .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));overflow:visible;margin:0 0 16px;padding:0}
 .opt{flex:none}
}
@media(min-width:1100px){.detail{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
@media(hover:hover){
 .opt:hover{border-color:var(--mute)}.opt.sel:hover{border-color:var(--acc)}
 .r2:hover,.srow:hover,.pl:hover{background:var(--s2)}
 .pill:hover{border-color:var(--mute)}
 .prow.empty:hover{background:var(--s2)}
 .xbtn:hover,.ibtn:hover{color:var(--tx)}
 .step button:hover:not(:disabled){background:var(--s3)}
 a:hover{text-decoration:underline}.btn:hover{text-decoration:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><h1>Armor Planner</h1><p>Monster Hunter Outlanders</p></div>
  <div class="appbar-actions">
    <button class="pill" id="infoBtn" type="button" aria-haspopup="dialog"><i class="dot"></i><span id="infoTxt"></span></button>
    <button class="pill" id="reset" type="button">Reset</button>
  </div>
</header>
<main class="wrap">
  <section class="side" aria-labelledby="hPrio">
    <div class="card">
      <div class="card-h"><h2 id="hPrio">Skill priority</h2><span class="hint">Up to 3 &middot; target level optional</span></div>
      <div id="prio"></div>
    </div>
  </section>
  <section class="res" aria-label="Builds">
    <div class="card start" id="start" hidden>
      <h2>Start with a skill</h2>
      <p>Pick up to three priority skills. The planner shows complete builds that trade one skill against another without wasting levels.</p>
      <button type="button" class="btn" data-act="pick" data-i="0">Choose first skill</button>
    </div>
    <div id="optsWrap" hidden>
      <div class="sec-h"><h2>Build options</h2><span class="hint" id="optHint"></span></div>
      <div class="opts" id="opts"></div>
    </div>
    <div class="detail">
      <div class="card" id="build"></div>
      <div class="card" id="tot"></div>
    </div>
  </section>
</main>
<div id="tip" hidden></div>
<dialog id="sheet" aria-labelledby="sheetT"><div class="sheet"><div class="grab"></div><div class="sheet-h"><h2 id="sheetT"></h2><button id="sheetX" type="button" aria-label="Close">&times;</button></div><div class="sheet-b" id="sheetB"></div></div></dialog>
<noscript><p style="padding:16px">This planner needs JavaScript.</p></noscript>

const DATA_DATE='2026-11-10',STALE_DAYS=14;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLOTS=['Head','Chest','Arms','Waist','Legs'];
const pieces=DATA.map((x,i)=>({id:i,name:x.n,slot:x.p,set:x.s,rar:x.r,def:x.d,ss:x.ss,sk:Object.fromEntries(x.k)}));
const bySlot={};SLOTS.forEach(s=>bySlot[s]=pieces.filter(p=>p.slot===s));
const names=[...new Set(pieces.flatMap(p=>Object.keys(p.sk)))].sort();
const lower=Object.fromEntries(names.map(n=>[n.toLowerCase(),n]));
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const setSlug=n=>slug(n.replace(/['’]s\b/g,''));
const capOf=n=>MAXL[n]||Infinity;
const canon=v=>lower[(v||'').trim().toLowerCase()]||null;
const SK_URL='https://gamewith.ai/monster-hunter-outlanders/en/skills/';
const ORD=['first','second','third'];

/* ---------- state ---------- */
const S={pri:[null,null,null],pins:{},sel:0},openInfo=new Set();
let LAST={pr:[],opts:[],cur:null,ch:{}};
function entries(){const o=[];S.pri.forEach((p,i)=>{if(p)o.push({n:p.n,t:Math.min(p.t>0?p.t:Infinity,capOf(p.n)),i})});return o}

/* ---------- optimizer (unchanged logic; pins is now a parameter) ---------- */
function options(pr,pins){
 if(!pr.length)return[];
 const z=pr.map(()=>0);let S=new Map([[z.join(),{L:z,w:0,u:0,d:0,picks:[]}]]);
 for(const s of SLOTS){
  const pin=pins[s]!=null?pieces[pins[s]]:null,cand=new Map();
  (pin?[pin]:bySlot[s]).forEach(p=>{const v=pr.map(q=>p.sk[q.n]||0),k=v.join();
   if(!pin&&v.every(x=>!x))return;const c=cand.get(k);if(!c||p.def>c.p.def)cand.set(k,{v,p})});
  const opts=[...cand.values()];if(!pin)opts.push({v:z,p:null});
  const N=new Map();
  for(const st of S.values())for(const o of opts){
   const L=[];let w=st.w;
   o.v.forEach((x,i)=>{const r=st.L[i]+x,l=Math.min(r,pr[i].t);L.push(l);w+=r-l});
   const u=st.u+(o.p?1:0),d=st.d+(o.p?o.p.def:0),k=L.join(),b=N.get(k);
   if(!b||w<b.w||(w===b.w&&(u<b.u||(u===b.u&&d>b.d))))N.set(k,{L,w,u,d,picks:st.picks.concat([o.p])});
  }
  S=N;}
 const all=[...S.values()],dom=(a,b)=>a.L.every((x,i)=>x>=b.L[i])&&a.L.some((x,i)=>x>b.L[i]);
 let fr=all.filter(a=>!all.some(b=>dom(b,a)));
 fr.sort((a,b)=>{for(let i=0;i<a.L.length;i++)if(a.L[i]!==b.L[i])return b.L[i]-a.L[i];return a.w-b.w});
 const sc=o=>Math.min(...o.L.map((x,i)=>x/pr[i].t))+.001*o.L.reduce((a,x,i)=>a+x/pr[i].t,0);
 const bal=fr.reduce((m,o)=>sc(o)>sc(m)?o:m,fr[0]);
 if(fr.length>6){const pk=new Set([fr[0],fr[fr.length-1],bal]);for(let i=1;i<5;i++)pk.add(fr[Math.round(i*(fr.length-1)/5)]);fr=fr.filter(o=>pk.has(o))}
 fr.forEach(o=>o.label=fr.length===1?'Best fit':o===fr[0]?'Favors P1':o===bal?'Balanced':'Trade-off');
 return fr;}
const stKey=pr=>pr.map(q=>q.n+':'+q.t).join('|')+'#'+SLOTS.map(s=>S.pins[s]==null?'':S.pins[s]).join(',');
const memo=new Map();
function solve(pr){const k=stKey(pr);let v=memo.get(k);if(!v){v=options(pr,S.pins);memo.set(k,v);if(memo.size>64)memo.delete(memo.keys().next().value)}return v}
function freeSkills(pr){
 const o=solve(pr)[0],out={};
 SLOTS.forEach((s,i)=>{if(S.pins[s]!=null||(o&&o.picks[i]))return;const b={};bySlot[s].forEach(p=>{for(const k in p.sk)b[k]=Math.max(b[k]||0,p.sk[k])});for(const k in b)out[k]=(out[k]||0)+b[k]});
 for(const k in out)out[k]=Math.min(out[k],capOf(k));return out}
const byVal=o=>Object.keys(o).sort((a,b)=>o[b]-o[a]||a.localeCompare(b));
const pct=(l,t)=>t===Infinity?(l>0?1:0):Math.min(1,l/t);
const lvTxt=(l,t)=>t===Infinity?String(l):l+'/'+t;

/* ---------- persistence ---------- */
const KEY='mho-planner-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({p:S.pri.map(x=>x&&[x.n,x.t]),k:Object.fromEntries(Object.entries(S.pins).map(([s,id])=>[s,pieces[id].name]))}))}catch(e){}}
function load(){try{
 const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;
 const seen=new Set();
 (d.p||[]).slice(0,3).forEach((x,i)=>{const n=x&&canon(x[0]);if(n&&!seen.has(n)){seen.add(n);S.pri[i]={n,t:x[1]>0?x[1]:null}}});
 for(const s in d.k||{}){const p=(bySlot[s]||[]).find(p=>p.name===d.k[s]);if(p)S.pins[s]=p.id}
}catch(e){}}

/* ---------- rendering ---------- */
function render(){
 const pr=entries(),key=stKey(pr);
 if(key!==LAST.key){S.sel=0}
 const opts=pr.length?solve(pr):[];
 if(S.sel>=opts.length)S.sel=0;
 const cur=opts[S.sel]||null,ch={};
 SLOTS.forEach((s,i)=>{ch[s]=S.pins[s]!=null?pieces[S.pins[s]]:(cur?cur.picks[i]:null)});
 const prevKey=LAST.key;
 LAST={pr,opts,cur,ch,key};
 renderPrio();renderOpts(prevKey);renderBuild();renderTotals();
 $('start').hidden=pr.length>0;
 $('reset').disabled=!pr.length&&!Object.keys(S.pins).length;
 save();
}
function renderPrio(){
 const {pr,cur,ch}=LAST,free=SLOTS.filter(s=>!ch[s]).length;
 $('prio').innerHTML=S.pri.map((p,i)=>{
  if(!p)return `<button type="button" class="prow empty p${i}" data-act="pick" data-i="${i}"><span class="ptag">P${i+1}</span><span class="pempty">Add ${ORD[i]} priority skill</span><span class="pplus" aria-hidden="true">+</span></button>`;
  const k=pr.findIndex(q=>q.i===i),q=pr[k],cap=capOf(p.n),stepMax=isFinite(cap)?cap:99;
  const lvl=cur?cur.L[k]:0,used=SLOTS.filter(s=>ch[s]&&ch[s].sk[p.n]).length;
  const isMax=p.t==null||p.t>=stepMax,val=isMax?(isFinite(cap)?cap:'max'):p.t;
  const miss=q.t!==Infinity&&lvl<q.t,open=openInfo.has(i);
  return `<div class="prow p${i}"><div class="prow-top"><button type="button" class="pmain" data-act="pick" data-i="${i}" aria-label="Change P${i+1} skill, currently ${esc(p.n)}"><span class="ptag">P${i+1}</span><span class="pname">${esc(p.n)}</span></button><button type="button" class="ibtn" data-act="info" data-i="${i}" aria-expanded="${open}" aria-label="About ${esc(p.n)}"><span>i</span></button><button type="button" class="xbtn" data-act="clr" data-i="${i}" aria-label="Remove P${i+1} skill">&times;</button></div>`+
   `<div class="prow-bot"><span class="pstat">Lv ${lvTxt(lvl,q.t)} &middot; ${used} piece${used===1?'':'s'} &middot; ${free} free${miss?'<span class="warn">Target not reached</span>':''}</span><span class="step" role="group" aria-label="Target level for P${i+1}"><button type="button" data-act="dec" data-i="${i}" aria-label="Lower target level"${!isMax&&p.t<=1||isMax&&stepMax<=1?' disabled':''}>&minus;</button><span class="sval">${val}${p.t==null?'<small>MAX</small>':''}</span><button type="button" data-act="inc" data-i="${i}" aria-label="Raise target level"${p.t==null?' disabled':''}>+</button></span></div>`+
   (open?`<div class="pinfo"><p>${esc(DESC[p.n]||'No description listed.')}</p><a href="${SK_URL}${slug(p.n)}" target="_blank" rel="noopener">Effect by level &#8599;</a></div>`:'')+`</div>`}).join('');
}
function renderOpts(prevKey){
 const {pr,opts,key}=LAST,box=$('opts');
 $('optsWrap').hidden=!opts.length;
 if(!opts.length){box.innerHTML='';return}
 if(key!==prevKey||!box.children.length){
  box.innerHTML=opts.map((o,k)=>{
   const bars=pr.map((q,i)=>`<span class="sb p${q.i}"><span class="sbt"><span>${esc(q.n)}</span><span>${lvTxt(o.L[i],q.t)}</span></span><span class="bar"><i style="transform:scaleX(${pct(o.L[i],q.t).toFixed(3)})"></i></span></span>`).join('');
   return `<button type="button" class="opt" data-opt="${k}" aria-pressed="false"><span class="oh"><span class="ol">${o.label}</span><span class="om">${o.w?o.w+' over cap':'no overcap'} &middot; ${SLOTS.length-o.u} free</span></span>${bars}</button>`}).join('');
  box.scrollLeft=0;
 }
 for(let k=0;k<box.children.length;k++){const on=k===S.sel,b=box.children[k];b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on)}
 $('optHint').textContent=opts.length+(opts.length===1?' option':' options · tap to compare');
}
function chips(p,pr){
 const pc=pr.filter(q=>p.sk[q.n]),oth=Object.keys(p.sk).length-pc.length;
 return pc.map(q=>`<span class="c cp p${q.i}">${esc(q.n)} ${p.sk[q.n]}</span>`).join('')+(oth?`<span class="c">+${oth} other</span>`:'');
}
function renderBuild(){
 const {pr,cur,ch}=LAST,free=SLOTS.filter(s=>!ch[s]).length,hasPins=Object.keys(S.pins).length>0;
 const rows=SLOTS.map(s=>{
  const p=ch[s];
  if(!p)return `<button type="button" class="r2 free" data-act="slot" data-slot="${s}"><span class="slotl">${s}</span><span class="pbody"><span class="piname">Free slot</span><span class="sub">${pr.length?'No priority skill needed here. Tap to choose a piece':'Tap to choose a piece'}</span></span><span class="chev" aria-hidden="true">&rsaquo;</span></button>`;
  return `<button type="button" class="r2" data-act="piece" data-slot="${s}" data-tip="${p.id}"><span class="slotl">${s}</span><span class="pbody"><span class="piname">${esc(p.name)}</span><span class="chips">${chips(p,pr)}</span></span><span class="pright">${S.pins[s]!=null?'<span class="badge">Pinned</span>':''}<span class="chev" aria-hidden="true">&rsaquo;</span></span></button>`}).join('');
 $('build').innerHTML=`<div class="card-h"><h2>Selected build</h2><span class="hint">${cur?esc(cur.label)+' &middot; ':''}${free} free slot${free===1?'':'s'}</span></div><div class="rows">${rows}</div>${hasPins?'<button type="button" class="link" data-act="unpinall">Unpin all pieces</button>':''}`;
}
function renderTotals(){
 const {pr,ch}=LAST,sure={},sets={};
 SLOTS.forEach(s=>{const c=ch[s];if(!c)return;for(const k in c.sk)sure[k]=(sure[k]||0)+c.sk[k];if(c.ss)sets[c.ss]=(sets[c.ss]||0)+1});
 const pi=n=>pr.findIndex(q=>q.n===n);
 const ks=[...new Set([...Object.keys(sure),...pr.map(q=>q.n)])].sort((a,b)=>{const pa=pi(a),pb=pi(b);if(pa>=0||pb>=0)return(pa<0?99:pa)-(pb<0?99:pb);return(sure[b]||0)-(sure[a]||0)||a.localeCompare(b)});
 const ss=Object.entries(sets).map(([n,c])=>{const d=SETS[n]||[2,''];return{n,c,r:d[0],k:d[1],on:c>=d[0]}}).sort((a,b)=>b.on-a.on||b.c-a.c);
 const rows=ks.map(n=>{
  const v=sure[n]||0,c=capOf(n),q=pr[pi(n)],shown=c===Infinity?v:Math.min(v,c)+'/'+c,over=v>c?v-c:0;
  return `<div class="trow${q?' cp p'+q.i:''}"><div class="tt"><span>${esc(n)}</span><span class="tv">${shown}${over?`<span class="over">+${over} over cap</span>`:''}</span></div>${q?`<span class="bar"><i style="transform:scaleX(${pct(Math.min(v,c),c).toFixed(3)})"></i></span>`:''}</div>`}).join('');
 const setRows=ss.map(e=>`<div class="setb${e.on?' on':''}"><div class="tt"><span>${esc(e.n)}${e.k?`<span class="mu" style="display:block;margin:0">+1 ${esc(e.k)}</span>`:''}</span><span class="tv">${e.c}/${e.r}${e.on?' active':''}</span></div><p class="mu">${esc(SETFX[e.n]||'')} <a href="https://gamewith.ai/monster-hunter-outlanders/en/skills/set/${setSlug(e.n)}" target="_blank" rel="noopener">Details</a></p></div>`).join('');
 $('tot').innerHTML=`<div class="card-h"><h2>Skills in this build</h2></div>`+(rows||'<p class="mu">Nothing selected yet.</p>')+(setRows?`<div class="sub-h">Set skills</div>${setRows}<p class="note">Set bonuses are not added to the levels above and are not used when choosing pieces.</p>`:'');
}

function openSkills(i){
 const pr=entries(),fs=freeSkills(pr.filter(q=>q.i<i)),taken=new Set(pr.filter(q=>q.i!==i).map(q=>q.n));
 const cur=S.pri[i]&&S.pri[i].n,list=byVal(fs).filter(n=>!taken.has(n));
 const rest=names.filter(n=>!fs[n]&&!taken.has(n));
 const row=(n,lv)=>`<button type="button" class="srow${n===cur?' cur':''}" data-act="setsk" data-i="${i}" data-n="${esc(n)}" data-k="${esc(n.toLowerCase())}"><span class="sr-main"><span class="sr-name">${esc(n)}</span><span class="sr-desc">${esc(DESC[n]||'')}</span></span><span class="sr-lv">${lv}</span></button>`;
 const rows=list.map(n=>row(n,'up to Lv '+fs[n])).join('')+(rest.length?`<div class="sr-div" id="sdiv"><b>Not reachable with the free slots</b><span>Choosing one trades off against earlier priorities</span></div>`+rest.map(n=>row(n,'trade-off')).join(''):'');
 openSheet(`Choose skill for P${i+1}`,`<div class="searchwrap"><input id="sq" class="search" type="search" placeholder="Search skills" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Search skills"></div><div id="slist">${rows||'<p class="none">No skills available.</p>'}<p class="none" id="snone" hidden>No skill matches.</p></div>`);
 if(matchMedia('(pointer:fine)').matches)$('sq').focus();
}
document.addEventListener('input',e=>{
 if(e.target.id!=='sq')return;
 const q=e.target.value.trim().toLowerCase(),div=$('sdiv');let n=0,afterDiv=0,past=false;
 for(const b of $('slist').children){if(b===div){past=true;continue}if(!b.dataset.k)continue;const hit=!q||b.dataset.k.includes(q);b.hidden=!hit;if(hit){n++;if(past)afterDiv++}}
 if(div)div.hidden=!afterDiv;
 $('snone').hidden=n>0||!$('slist').querySelector('[data-k]');
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||e.target.id!=='sq')return;
 const b=[...$('slist').querySelectorAll('[data-k]')].find(x=>!x.hidden);if(b){e.preventDefault();b.click()}
});

function pieceInfo(p){
 const pr=LAST.pr,cnt={};SLOTS.forEach(s=>{const c=LAST.ch[s];if(c&&c.ss)cnt[c.ss]=(cnt[c.ss]||0)+1});
 const sk=Object.entries(p.sk).map(([k,v])=>{const q=pr.find(x=>x.n===k),c=capOf(k);return `<div class="tl${q?' cp p'+q.i:''}"><span>${esc(k)}</span><span>Lv ${v}${isFinite(c)?' / '+c:''}</span></div>`}).join('');
 const d=SETS[p.ss];
 const set=p.ss?`<div class="setb"><div class="tt"><span>Set skill</span><span>${esc(p.ss)}</span></div><p>${d?`${d[0]} pieces needed${d[1]?' &rarr; +1 '+esc(d[1]):''}`:''}${cnt[p.ss]?` &middot; ${cnt[p.ss]} in this build`:''}</p><p>${esc(SETFX[p.ss]||'')}</p></div>`:'';
 return `<div class="pi-meta">${p.slot} &middot; ${esc(p.set)} &middot; Def ${p.def} &middot; Rarity ${esc(p.rar)}</div>${sk}${set}`;
}
function openPiece(slot){
 const p=LAST.ch[slot];if(!p)return;const pinned=S.pins[slot]!=null;
 openSheet(p.name,`<div class="pi">${pieceInfo(p)}</div><div class="acts">${pinned?`<button type="button" class="btn ghost" data-act="unpin" data-slot="${slot}">Unpin this piece</button>`:`<button type="button" class="btn" data-act="pin" data-slot="${slot}" data-id="${p.id}">Pin this piece</button>`}<button type="button" class="btn ghost" data-act="slot" data-slot="${slot}">Choose a different piece</button></div>`);
}
function openSlot(slot){
 const {pr,ch}=LAST,c=ch[slot],score=p=>pr.reduce((a,q)=>a+(p.sk[q.n]||0),0);
 const list=[...bySlot[slot]].sort((a,b)=>(c===b)-(c===a)||score(b)-score(a)||b.def-a.def);
 const rows=list.map(p=>`<button type="button" class="pl${c===p?' cur':''}${pr.length&&!score(p)&&c!==p?' dim':''}" data-act="pin" data-slot="${slot}" data-id="${p.id}"><span class="r1"><span class="pn">${esc(p.name)}</span><span class="pd">Def ${p.def} &middot; R${esc(p.rar)}</span></span><span class="sub">${esc(p.set)}</span><span class="chips">${Object.entries(p.sk).map(([k,v])=>{const q=pr.find(x=>x.n===k);return `<span class="c${q?' cp p'+q.i:''}">${esc(k)} ${v}</span>`}).join('')}</span></button>`).join('');
 openSheet(`${slot}: choose a piece`,(S.pins[slot]!=null?`<button type="button" class="unpin" data-act="unpin" data-slot="${slot}">Let the planner choose this slot</button>`:'')+rows);
}
function openData(){
 const d=new Date(DATA_DATE+'T00:00:00'),age=Math.floor((Date.now()-d)/864e5),old=age>STALE_DAYS;
 const when=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
 openSheet('About the data',`<div class="info">${old?`<p class="warnbox">This data is ${age} days old and may be outdated. Compare the piece count with the source.</p>`:''}<dl><div><dt>Data as of</dt><dd>${when}</dd></div><div><dt>Pieces</dt><dd>${pieces.length}</dd></div><div><dt>Skills</dt><dd>${names.length}</dd></div></dl><p>Armor, skill and set data comes from GamesWith. Compare the piece count above with their armor list to check whether this data is current. The planner cannot check the source by itself.</p><a class="btn ghost" href="https://gamewith.ai/monster-hunter-outlanders/en/armor" target="_blank" rel="noopener">Open the GamesWith armor list</a><p>Unofficial fan project. Not affiliated with or endorsed by Capcom or the Monster Hunter Outlanders developers. Monster Hunter is a trademark of Capcom.</p></div>`);
}

/* ---------- desktop hover preview (mouse only, no mousemove tracking) ---------- */
const tip=$('tip');let tipEl=null;
function hideTip(){tipEl=null;tip.hidden=true}
document.addEventListener('pointerover',e=>{
 if(e.pointerType!=='mouse'||dlg.open||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
 const el=e.target.closest&&e.target.closest('[data-tip]');
 if(el===tipEl)return;
 if(!el){hideTip();return}
 tipEl=el;const p=pieces[+el.dataset.tip];
 tip.innerHTML=`<h4>${esc(p.name)}</h4>${pieceInfo(p)}`;tip.hidden=false;
 const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
 let x=r.right+10;if(x+w>innerWidth-8)x=Math.max(8,r.left-w-10);
 tip.style.transform=`translate(${x}px,${Math.min(Math.max(8,r.top),Math.max(8,innerHeight-h-8))}px)`;
});
document.documentElement.addEventListener('mouseleave',hideTip);
addEventListener('scroll',hideTip,{passive:true});

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act],[data-opt]');if(!b)return;
 hideTip();
 if(b.dataset.opt!=null){S.sel=+b.dataset.opt;render();return}
 const a=b.dataset.act,i=+b.dataset.i,slot=b.dataset.slot;
 if(a==='pick')openSkills(i);
 else if(a==='setsk'){const n=b.dataset.n,prev=S.pri[i];S.pri[i]={n,t:prev&&prev.n===n?prev.t:null};dlg.close();render()}
 else if(a==='clr'){S.pri[i]=null;openInfo.delete(i);render()}
 else if(a==='info'){openInfo.has(i)?openInfo.delete(i):openInfo.add(i);renderPrio()}
 else if(a==='dec'||a==='inc'){
  const p=S.pri[i],cap=capOf(p.n),max=isFinite(cap)?cap:99,cur=p.t==null?max:p.t;
  if(a==='dec'&&cur>1)p.t=cur-1;
  else if(a==='inc'&&p.t!=null)p.t=p.t+1>=max?null:p.t+1;
  render()}
 else if(a==='piece')openPiece(slot);
 else if(a==='slot')openSlot(slot);
 else if(a==='pin'){S.pins[slot]=+b.dataset.id;dlg.close();render()}
 else if(a==='unpin'){delete S.pins[slot];dlg.close();render()}
 else if(a==='unpinall'){S.pins={};render()}
});
$('reset').addEventListener('click',()=>{S.pri=[null,null,null];S.pins={};S.sel=0;openInfo.clear();render()});
$('infoBtn').addEventListener('click',openData);

/* ---------- data stamp ---------- */
(function(){
 const d=new Date(DATA_DATE+'T00:00:00'),old=Math.floor((Date.now()-d)/864e5)>STALE_DAYS,b=$('infoBtn');
 b.classList.toggle('old',old);
 $('infoTxt').textContent=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
 b.setAttribute('aria-label','About the data, as of '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+(old?', may be outdated':''));
})();

load();render();
</script>
</body>
</html>
