name: Update armor data

on:
  push:
    paths:
      - data/armor_list.xlsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Rebuild data in index.html
        run: |
          python update_data.py data/armor_list.xlsx index.html | tee update.log
          {
            echo '### Armor data update'
            echo '```'
            cat update.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm update.log

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Update armor data from armor_list.xlsx"
            git push
          fi
